# config.yaml
# This file defines the authorization policies for the SSH Certificate Authority.
# It maps Kerberos principals (users) to groups, and groups to specific
# certificate signing permissions.
#
# ┌──────────────────────────────────────────────────────────────────────┐
# │                    CASBIN AUTHORIZATION MODEL                       │
# ├──────────────────────────────────────────────────────────────────────┤
# │ This file is the SINGLE SOURCE OF TRUTH for authorization.          │
# │ There is no separate Casbin policy or model file — both are         │
# │ generated programmatically from this YAML at startup.               │
# │                                                                     │
# │ HOW IT WORKS:                                                       │
# │                                                                     │
# │ 1. Each group's members become user-to-group mappings:              │
# │      alice@REALM.COM  →  backend-engineers                          │
# │      bob@REALM.COM    →  backend-engineers                          │
# │      charlie@REALM.COM → data-analysts                              │
# │                                                                     │
# │ 2. Each group's allowed_principals become Casbin policies:          │
# │      p, backend-engineers, root, sign                               │
# │      p, backend-engineers, ec2-user, sign                           │
# │      p, data-analysts, analyst, sign                                │
# │      p, data-analysts, readonly-user, sign                          │
# │                                                                     │
# │ 3. When a user requests a certificate, Casbin evaluates:            │
# │      Enforce(groupName, requestedPrincipal, "sign")                 │
# │    for each group the user belongs to (alphabetical order).         │
# │                                                                     │
# │ RULES:                                                              │
# │  - Groups are evaluated in alphabetical order (deterministic)       │
# │  - ALL requested principals must match within a SINGLE group        │
# │  - A user in multiple groups CANNOT combine principals across them  │
# │  - Use "*" in allowed_principals to permit any SSH principal        │
# │  - The matched group's certificate_rules (validity, permissions,    │
# │    attributes, critical_options) are applied to the certificate     │
# │                                                                     │
# │ EXAMPLE — user in multiple groups:                                  │
# │  alice is in both "backend-engineers" and "data-analysts":          │
# │    Request ["root"]    → allowed via backend-engineers (8h cert)    │
# │    Request ["analyst"] → allowed via data-analysts (1h cert)        │
# │    Request ["root", "analyst"] → DENIED (no single group has both)  │
# └──────────────────────────────────────────────────────────────────────┘

# Path to the Kerberos keytab file for authenticating incoming requests
keytab_path: "/etc/krb5.keytab"

# Service principal name for SPNEGO authentication (optional)
# If not specified, the service will use the principal from the keytab
# Example: "HTTP/hostname.domain.com@REALM.COM"
service_principal: ""

# IP address and port to listen on, default ":8443" if not specified
listen: ""

# Location of the TLS certificate and key, defaults are "cert.pem", "key.pem" in the same folder as the binary
# For local dev, generate self-signed certs: go run $(go env GOROOT)/src/crypto/tls/generate_cert.go --host localhost
tls_cert: ""
tls_key: ""

# ──────────────────────────────────────────────────────────────────────
# Realm stripping for static members (optional)
# ──────────────────────────────────────────────────────────────────────
# SPNEGO/GSSAPI authenticates users as "uid@REALM.COM". By default `members:`
# entries must be written in that full form. List a realm here and its @REALM
# suffix is removed before the static `members:` match, so you can enumerate
# members by bare short name (alice) instead of alice@REALM.COM.
#
#   - Only principals whose realm is listed are stripped. Identities in other
#     realms keep the full uid@REALM form, so alice@EXAMPLE.COM and
#     alice@OTHER.COM never collapse onto the same members entry unless you
#     list BOTH realms (which you should only do if that collision is intended).
#   - Matching is case-sensitive; Kerberos realms are conventionally uppercase.
#   - This affects only static `members:`. LDAP-backed `ldap_groups:` routing
#     always sees the full uid@REALM string, so directory lookups are unchanged.
#   - Omit or leave empty to keep the default exact uid@REALM matching.
# strip_realms:
#   - EXAMPLE.COM

# ──────────────────────────────────────────────────────────────────────
# Self-service certificates (optional)
# ──────────────────────────────────────────────────────────────────────
# Let an authenticated user obtain a certificate for their OWN identity — the
# short uid of their Kerberos principal (jsmith@FOO.COM -> "jsmith") — without
# being enumerated in any group. Disabled unless `enabled: true`.
#
#   - `realms` is an allowlist: only callers whose realm is listed may self-issue.
#     This blocks the cross-realm collision where jsmith@FOO.COM and
#     jsmith@BAR.COM would both map onto local account "jsmith". Single-realm
#     shops list their one realm.
#   - `deny` lists short uids that may never be self-issued. There is no
#     hardcoded floor — "root" is self-issuable like any other uid, since this
#     is the intended path for replacing static root SSH keys. Add "root" here
#     yourself if you want to keep denying it; otherwise add shared/role
#     accounts you don't want self-issued (e.g. deploy, postgres).
#   - `certificate_rules` supplies validity/permissions/etc. for the issued cert;
#     its `allowed_principals` is ignored (the principal is the caller's uid).
#   - The issued cert only opens accounts sshd authorizes for that principal
#     (default: the account named after the uid, or an AuthorizedPrincipalsFile
#     mapping), so the server stays the final gate. See docs/RUNBOOK.md.
# self_principal:
#   enabled: true
#   realms:
#     - EXAMPLE.COM
#   deny:
#     - deploy          # add 'root' here too if you want to keep denying it
#   certificate_rules:
#     validity: "8h"
#     permissions:
#       permit-pty: ""

# ──────────────────────────────────────────────────────────────────────
# OIDC bearer-token authentication (optional)
# ──────────────────────────────────────────────────────────────────────
# Accept `Authorization: Bearer <JWT>` from an OIDC identity provider (Okta,
# Azure AD, Google, Keycloak, …) as a SECOND authentication method alongside
# Kerberos/SPNEGO. The API dispatches on the Authorization scheme: `Negotiate`
# is Kerberos, `Bearer` is OIDC. Omit this block (or set enabled: false) and the
# service behaves exactly as a Kerberos-only deployment.
#
# Tokens are validated entirely offline: the issuer's JWKS (discovered at
# startup, refreshed on key rotation) verifies the signature; the issuer,
# audience, and exp/nbf/iat are checked on every request.
#
#   - `issuer` is the OIDC issuer URL; its /.well-known/openid-configuration is
#     fetched at startup and the API refuses to start if it is unreachable.
#   - `audiences` is the set of acceptable `aud` values (this service's client
#     ID / identifier at the IdP). A token must carry at least one of them.
#   - `username_claim` selects the claim used as the short uid (default "sub";
#     "preferred_username" or "email" are common). Together with `realm` it forms
#     the Username@Realm identity used for the cert KeyID, audit logs, and rate
#     limiting — NOT for authorization.
#   - `groups_claim` selects the claim (a JSON array of group names, default
#     "groups") used for authorization: its values are matched against the
#     per-group `oidc_groups:` bindings, exactly like LDAP `ldap_groups:`.
#   - `realm` is a SYNTHETIC label for OIDC identities. Pick one that does NOT
#     collide with any Kerberos/LDAP realm or a strip_realms entry (a collision
#     is warned at startup) so OIDC identities are never misrouted or stripped.
#   - `algorithms` restricts accepted JWS signing algorithms to an asymmetric
#     allowlist (default ["RS256"]); `none` and HMAC HS* are rejected to defeat
#     algorithm-confusion attacks.
#   - `leeway` is the clock-skew tolerance for exp/nbf/iat (default 60s).
#   - `http_timeout` bounds discovery and JWKS fetches (default 5s).
#
# Clients authenticate with the OAuth 2.0 Device Authorization Grant: the bundled
# `cssh` wrapper supports `--oauth` / `CSSH_AUTH=oidc` and caches the token (with
# silent refresh) under ~/.cache/cerberus. Callers may also supply a token
# out-of-band. Protect cached/bearer tokens like any credential. See
# docs/RUNBOOK.md and docs/cssh.md.
# oauth:
#   enabled: true
#   issuer: "https://idp.example.com"
#   audiences:
#     - "cerberus"
#   username_claim: "preferred_username"
#   groups_claim: "groups"
#   realm: "OIDC"
#   algorithms:
#     - "RS256"
#   leeway: "60s"
#   http_timeout: "5s"

# ──────────────────────────────────────────────────────────────────────
# LDAP-backed RBAC (optional)
# ──────────────────────────────────────────────────────────────────────
# Each entry under `ldap:` declares one directory backend. Backends are
# routed by Kerberos realm: when a user authenticates as `alice@REALM-A`,
# the backend whose `realms:` includes `REALM-A` is consulted and `alice`
# (the short uid) is looked up. Realms must not overlap across backends.
#
# Per-group rules:
#   - A group is either `members:` (static) OR `ldap_groups:` (LDAP-backed),
#     never both. Validated at startup.
#   - LDAP failure for an LDAP-backed group fails closed (denies the
#     request). Static groups are unaffected by LDAP state.
#
# Delete the entire `ldap:` section to disable directory-backed RBAC; the
# service then behaves exactly as it did before LDAP support was added.
#
# ldap:
#   - name: corp-ad
#     realms: [CORP.EXAMPLE.COM]
#     url: ldaps://ad.corp.example:636
#     bind:
#       method: simple                   # simple | gssapi | anonymous
#       dn: "CN=ssh-cert-api,OU=Service,DC=corp,DC=example"
#       password_file: /etc/cerberus/ldap.pw    # mode 0600 / 0400 only
#     user_base_dn: "DC=corp,DC=example"
#     # Exactly one %s placeholder, LDAP-escaped at request time. The attribute
#     # MUST match the directory's schema: `sAMAccountName` for Active Directory,
#     # `uid` for FreeIPA / 389-DS / OpenLDAP. A filter that matches nothing (e.g.
#     # the AD `sAMAccountName` example pointed at a FreeIPA server) returns zero
#     # entries, which is treated as "user has no groups" — a silent denial, not
#     # an error. See the corp-openldap / FreeIPA examples below for `(uid=%s)`.
#     user_filter: "(sAMAccountName=%s)"
#     group_membership_attr: memberOf           # default
#     tls:
#       ca_file: /etc/cerberus/ldap-ca.pem
#       insecure_skip_verify: false             # warned at startup if true
#     timeout: 5s                                # default
#     cache_ttl: 60s                             # default; hard cap 10m
#
#   # GSSAPI bind reuses the API's own keytab. client_principal selects the
#   # initiator identity within the keytab.
#   - name: corp-openldap
#     realms: [OTHER.EXAMPLE.COM]
#     url: ldaps://ldap.other.example:636
#     bind:
#       method: gssapi
#       client_principal: "HTTP/api.example.com@OTHER.EXAMPLE.COM"
#       krb5_conf_path: /etc/krb5.conf          # default
#     user_base_dn: "ou=people,dc=other,dc=example"
#     user_filter: "(uid=%s)"
#     group_membership_attr: memberOf
#     tls:
#       ca_file: /etc/cerberus/other-ca.pem
#
#   # SRV discovery: instead of a fixed url, resolve servers from a DNS SRV
#   # record (RFC 2782). The queried name is _<service>._<proto>.<domain>
#   # (defaults _ldap._tcp). Discovered targets carry their own host+port and
#   # are tried in priority/weight order with failover. url and srv are
#   # mutually exclusive.
#   - name: corp-ad-srv
#     realms: [CORP.EXAMPLE.COM]
#     srv:
#       domain: corp.example.com        # -> _ldap._tcp.corp.example.com
#       # service: ldap                 # default
#       # proto: tcp                    # default
#       # cache_ttl: 30s                # SRV lookup cache; default 30s, cap 10m
#     # AD SRV records are on port 389, so choose how to encrypt:
#     #   starttls -> plaintext dial then upgrade; ldaps -> implicit TLS;
#     #   none -> plaintext (warned at startup against a non-loopback domain).
#     tls_mode: starttls                # required for srv: ldaps | starttls | none
#     bind:
#       method: gssapi
#       client_principal: "HTTP/api.example.com@CORP.EXAMPLE.COM"
#     user_base_dn: "DC=corp,DC=example"
#     user_filter: "(sAMAccountName=%s)"
#     tls:
#       ca_file: /etc/cerberus/ldap-ca.pem

groups:
  # The 'backend-engineers' group has access to production servers.
  backend-engineers:
    # List of Kerberos principals (e.g., from Active Directory or MIT Kerberos)
    # who belong to this group. The API will check the authenticated user's
    # principal against this list.
    members:
      - "alice@YOUR-REALM.COM"
      - "bob@YOUR-REALM.COM"

    # Rules that apply to certificates issued to members of this group.
    certificate_rules:
      # Maximum validity period for the certificate. Uses Go's time.ParseDuration format.
      # (e.g., "8h" for 8 hours, "30m" for 30 minutes).
      validity: "8h"

      # A list of server usernames (principals) that the signed key is allowed
      # to log in as. These become Casbin policies: p, <group>, <principal>, sign
      # Use "*" as a single entry to allow ANY SSH principal for this group.
      # Example wildcard: allowed_principals: ["*"]
      allowed_principals:
        - "root"
        - "ec2-user"

      # Standard SSH certificate permissions.
      # An empty string "" means the permission is granted.
      # A non-empty string can add specific restrictions (though typically not used).
      # If a permission is omitted, it is denied.
      # Full list at: https://www.ietf.org/id/draft-miller-ssh-cert-01.html

      # Some basic extensions:
      # permit-x11-forwarding: Permit X11 forwarding (using ssh -X) to run remote X11 programs on a local display.
      # permit-agent-forwarding: Permit Agent forwarding (using ssh -A) to forward local SSH agent keys to the remote host. (See our blog post SSH Agent Explained for more.)
      # permit-port-forwarding: Permit port forwardings (tunnels) from local to remote (using ssh -L) or from remote to local (using ssh -R)
      # permit-pty: This one's pretty important. If you want an interactive shell session, you need a pty (a pseudo-tty) to be allocated to you by the host. The alternative is a remote host that doesn't allow any interactivity.
      # permit-user-rc: Run a personal RC file upon connection (located in ~/.ssh/rc on the remote)
      permissions:
        permit-X11-forwarding: ""
        permit-agent-forwarding: ""
        permit-port-forwarding: ""
        permit-pty: ""
        permit-user-rc: ""

      # Static key-value pairs that will be embedded as custom extensions
      # in the signed certificate. Useful for auditing and context.
      #
      # Per the SSH certificate spec (PROTOCOL.certkeys §4), names that are
      # not defined by OpenSSH MUST be namespaced as `name@domain` to avoid
      # collisions with future standard extensions. sshd will still log a
      # benign "extension is not supported" message for these — that's
      # expected, the cert authenticates fine. Replace `example.com` with
      # your organization's domain.
      static_attributes:
        team@example.com: "backend"
        access-level@example.com: "production"

      # Critical options are a set of directives that, when present in a certificate, must be understood and processed by the SSH server.
      # If the server doesn't recognize a critical option, it will reject the certificate, preventing authentication.
      # The most common critical options are force-command and source-address.
      critical_options:
        source-address: "10.20.30.0/24,1.1.1.1/32"

  # The 'data-analysts' group has more restricted access.
  data-analysts:
    members:
      - "charlie@YOUR-REALM.COM"

    certificate_rules:
      validity: "1h"
      allowed_principals:
        - "analyst"
        - "readonly-user"
      permissions:
        # Note: No port forwarding for this group.
        permit-pty: ""
        permit-user-rc: ""
      static_attributes:
        team@example.com: "data"
        access-level@example.com: "restricted"

  # Example of an LDAP-backed group. Membership is decided at request time
  # by querying the LDAP backend whose realms cover the user's Kerberos
  # realm. A user qualifies for this group if their `memberOf` attribute
  # in LDAP includes ANY of the DNs listed here. Cannot coexist with
  # `members:` in the same group.
  #
  # IMPORTANT: ldap_groups entries are matched as FULL GROUP DNs, not bare
  # group names. Matching lowercases both sides but does no CN extraction, so
  # `ssh-admins` will NOT match a memberOf value of
  # `cn=ssh-admins,ou=groups,dc=corp,dc=example` — you must list the whole DN
  # exactly as the directory returns it. Confirm the real value with:
  #   ldapsearch -x -H <url> -b <user_base_dn> '(<user_filter with uid>)' memberOf
  #
  # Active Directory:
  # ssh-admins:
  #   ldap_groups:
  #     - "CN=ssh-admins,OU=Groups,DC=corp,DC=example"
  #   certificate_rules:
  #     validity: "8h"
  #     allowed_principals: ["root"]
  #     permissions:
  #       permit-pty: ""
  #
  # FreeIPA (note the cn=groups,cn=accounts container and the full DN):
  # ssh-admins:
  #   ldap_groups:
  #     - "cn=ssh-admins,cn=groups,cn=accounts,dc=corp,dc=example"
  #   certificate_rules:
  #     validity: "8h"
  #     allowed_principals: ["root"]
  #     permissions:
  #       permit-pty: ""

  # Example of an OIDC-backed group. Membership is decided per request by
  # matching the bearer token's groups claim (see oauth.groups_claim) against
  # the values listed here. Requires oauth.enabled: true. A group has exactly
  # one membership source — oidc_groups cannot coexist with `members:` or
  # `ldap_groups:` in the same group.
  #
  # oidc-admins:
  #   oidc_groups:
  #     - "platform-eng"        # values exactly as they appear in the token's groups claim
  #     - "sre"
  #   certificate_rules:
  #     validity: "8h"
  #     allowed_principals: ["root"]
  #     permissions:
  #       permit-pty: ""
