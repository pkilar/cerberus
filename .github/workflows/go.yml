name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Build & test (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [".", "ssh-cert-api", "ssh-cert-signer"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Build
        working-directory: ${{ matrix.module }}
        run: go build -v ./...

      - name: go mod tidy drift check
        working-directory: ${{ matrix.module }}
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Test with race detector and shuffled order
        working-directory: ${{ matrix.module }}
        run: go test -race -shuffle=on -count=1 ./...

  lint:
    name: golangci-lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [".", "ssh-cert-api", "ssh-cert-signer"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - uses: golangci/golangci-lint-action@v9
        with:
          # Pinned so a surprise upstream rule release can't red a PR.
          # Dependabot's github-actions ecosystem bumps this PR-by-PR.
          #
          # Two separate constraints tie this pin to the go.mod `go` line, and
          # they do NOT have the same granularity:
          #   1. Language version: must be built with Go >= our `go` line or the
          #      action errors with "Go language version ... lower than the
          #      targeted Go version". Compared on M.m only (the patch component
          #      is trimmed), so a patch bump never trips this one.
          #   2. Export-data reader: the vendored go/types importer must handle
          #      the export-data version the *installed* toolchain emits. This IS
          #      patch-sensitive -- Go 1.27.2 bumped it from 4 to 5, and v2.13.2
          #      (fine under 1.27.0) then fails every file with "export data
          #      version 5 is greater than maximum supported version 4
          #      (typecheck)". Neither is a lint finding; no code change clears
          #      either. v2.14.0 is the first release that reads version 5.
          #
          # So when the `go` line moves at all, even by a patch, re-run the
          # linter locally against that exact toolchain before trusting the pin.
          version: v2.14.0
          working-directory: ${{ matrix.module }}

  vuln:
    name: govulncheck (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [".", "ssh-cert-api", "ssh-cert-signer"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        working-directory: ${{ matrix.module }}
        run: govulncheck ./...

  gosec:
    name: gosec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            ssh-cert-api/go.sum
            ssh-cert-signer/go.sum

      # gosec's newest release (v2.29.0) pins golang.org/x/tools v0.49.0, whose
      # export-data reader caps at version 4 while Go 1.27.2 emits version 5 --
      # the same incompatibility described on the golangci-lint pin above. A
      # plain `go install gosec@latest` therefore reports "export data version 5
      # is greater than maximum supported version 4" against every import and
      # exits 1 having found *zero* issues, which looks like a finding but is a
      # tooling failure. Build it in a throwaway module with x/tools raised so it
      # can read this toolchain's export data. Both versions are pinned because
      # they have to be chosen as a pair; collapse this back to a one-line
      # `go install` once a gosec release ships x/tools >= v0.50.0.
      - name: Install gosec
        run: |
          set -euo pipefail
          d="$(mktemp -d)"
          cd "$d"
          go mod init gosecbuild
          go get github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          go get golang.org/x/tools@v0.50.0
          go build -o "$(go env GOPATH)/bin/gosec" github.com/securego/gosec/v2/cmd/gosec

      # -severity=medium filters LOW-severity noise: G104 (unchecked
      # json.NewEncoder(w).Encode — best-effort HTTP response writes) and
      # G706 (log-injection via taint — slog text/JSON handlers already
      # escape structured attrs, so this is a false positive at scale).
      # MEDIUM+ findings still fail the build and are fixed inline with
      # #nosec comments carrying a justification.
      - name: gosec (root)
        run: gosec -severity=medium ./...

      - name: gosec (ssh-cert-api)
        working-directory: ssh-cert-api
        run: gosec -severity=medium ./...

      - name: gosec (ssh-cert-signer)
        working-directory: ssh-cert-signer
        run: gosec -severity=medium ./...

  # The cssh client helper is shell, not Go, so `go test` never reaches it.
  # These cover the certificate-cache sidecar (<privkey>-cert.requested), which
  # is what keeps a mapped certificate (root -> global-root) cacheable. Run
  # under both shells cssh supports; zsh scopes some constructs differently and
  # has already caught one bug bash did not.
  cssh:
    name: cssh client tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: cssh sidecar tests (bash)
        run: bash tests/cssh_sidecar_test.sh

      - name: cssh sidecar tests (zsh)
        run: zsh tests/cssh_sidecar_test.sh

      - name: cssh login-as tests (bash)
        run: bash tests/cssh_login_as_test.sh

      - name: cssh login-as tests (zsh)
        run: zsh tests/cssh_login_as_test.sh
